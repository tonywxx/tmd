name: Release

# Builds the Tauri app and publishes a GitHub release. Stable tags
# (v1.2.3) publish to the "latest" release; pre-release / beta tags
# (v1.2.3-beta.1) publish to a rolling "beta" release so the app's
# beta-updates channel can find them.
#
# The updater endpoints in tauri.conf.json point at:
#   - https://github.com/tonywxx/tmd/releases/latest/download/latest.json   (stable)
#   - https://github.com/tonywxx/tmd/releases/beta/download/latest.json      (beta)
# For these to resolve, the releases MUST be published (not drafts) and the
# stable one must not be a pre-release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3 or v1.2.3-beta.1)"
        required: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Import the Apple Developer ID certificate (if provided) so the build
      # is codesigned and notarized. If the import fails for any reason we
      # fall back to an ad-hoc build so the release still gets created and the
      # Tauri updater (which signs with TAURI_SIGNING_PRIVATE_KEY, independent
      # of Apple codesign) keeps working.
      - name: Import Apple signing certificate
        id: cert
        continue-on-error: true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple signing certificate provided; will build ad-hoc."
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "has_cert=true" >> "$GITHUB_OUTPUT"

      # For beta tags, reset the rolling "beta" release so each beta push
      # overwrites the previous one (the app's beta channel always points at
      # releases/beta/download/latest.json). Both commands are best-effort:
      # the very first beta has no prior release/tag to delete.
      - name: Reset rolling beta release
        if: contains(env.RELEASE_TAG, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes || true
          git push origin :refs/tags/beta || true

      # NOTE: GitHub Actions cannot conditionally *omit* an env key, only set
      # it to empty. Tauri's bundler treats an empty APPLE_CERTIFICATE as
      # "present" and tries to `security import` it (and fails). So we use two
      # build steps: the ad-hoc one does NOT define any APPLE_* vars at all,
      # which makes Tauri sign ad-hoc without touching the keychain.
      - name: Build & release (codesigned)
        if: steps.cert.outputs.has_cert == 'true'
        # Pinned to v0.6.2: the mutable @v0 major tag resolved to an older
        # commit at build time that does NOT collect the macOS
        # `*.app.tar.gz.sig` artifact, so tauri-action never generated
        # latest.json and the updater endpoint 404'd. v0.6.2 reliably
        # collects the .sig, uploads it, and builds the signed latest.json.
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — required for the auto-updater to verify
          # downloaded updates. Independent of Apple codesign.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: src-tauri
          tagName: ${{ contains(env.RELEASE_TAG, '-') && 'beta' || env.RELEASE_TAG }}
          releaseName: ${{ contains(env.RELEASE_TAG, '-') && 'beta' || format('tmd {0}', env.RELEASE_TAG) }}
          releaseBody: "Download the asset below. The app also auto-updates from GitHub."
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: --target aarch64-apple-darwin

      - name: Build & release (ad-hoc)
        if: steps.cert.outputs.has_cert != 'true'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — required for the auto-updater to verify
          # downloaded updates. Independent of Apple codesign. The app itself
          # is built ad-hoc (no Apple cert), so Gatekeeper may warn on first
          # launch, but the updater still works.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ contains(env.RELEASE_TAG, '-') && 'beta' || env.RELEASE_TAG }}
          releaseName: ${{ contains(env.RELEASE_TAG, '-') && 'beta' || format('tmd {0}', env.RELEASE_TAG) }}
          releaseBody: "Download the asset below. The app also auto-updates from GitHub."
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: --target aarch64-apple-darwin
