<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tmd export</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial,
          sans-serif;
        color: #1d1f24;
        background: #fff;
      }
      #export-root {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 56px;
        line-height: 1.6;
      }
      #export-root pre {
        background: #f5f5f7;
        padding: 12px 14px;
        border-radius: 6px;
        overflow-x: auto;
      }
      #export-root code {
        font-family: "SF Mono", Menlo, monospace;
      }
      #export-root img {
        max-width: 100%;
      }
      #export-root table {
        border-collapse: collapse;
      }
      #export-root th,
      #export-root td {
        border: 1px solid #ddd;
        padding: 6px 10px;
      }
      @media print {
        #export-root {
          padding: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="export-root" class="markdown-body"></div>
    <script type="module" src="/src/export.tsx"></script>
  </body>
</html>
